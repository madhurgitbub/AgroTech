<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login – AgroTECH</title><link rel="stylesheet" href="../css/global.css"><style>body{min-height:100vh;background:linear-gradient(135deg,#062b0a,#145a1c,#2e7d32);display:grid;place-items:center;padding:20px}.auth{width:min(440px,100%)}.brand{text-align:center;color:white;margin-bottom:20px}.brand h1{margin:8px 0}.brand span{color:#69f0ae}.card{background:white;border-radius:22px;padding:32px;box-shadow:0 24px 70px #0006}.badge{display:inline-block;background:#e8f5e9;color:#1b5e20;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.error{display:none;background:#ffebee;color:#c62828;padding:10px;border-radius:10px;margin-bottom:14px}.error.show{display:block}.links{text-align:center;margin-top:15px;font-size:14px}.links a{color:#2e7d32;font-weight:700;text-decoration:none}</style></head><body><div class="auth"><div class="brand"><div style="font-size:44px">🛡️</div><h1>Agro<span>TECH</span></h1><p>Administrator Portal</p></div><div class="card"><span class="badge">ADMIN ACCESS</span><h2>Login as Admin</h2><p style="color:#667085">Use your administrator credentials to access the control panel.</p><div id="err" class="error"></div><div class="form-group"><label class="form-label">Admin Email / Username</label><input id="email" class="form-input" placeholder="admin@agrotech.com"></div><div class="form-group"><label class="form-label">Password</label><input id="password" type="password" class="form-input" placeholder="Enter password"></div><button class="btn btn-primary btn-full btn-lg" onclick="loginAdmin()">Login as Admin →</button><div class="links"><a href="admin-register.html">Register as Admin</a> · <a href="../index.html">Back to Home</a></div></div></div><script src="../js/api.js"></script><script src="../js/global.js"></script><script>
async function loginAdmin(){const e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;const err=document.getElementById('err');if(!e||!p){err.textContent='Please enter email/username and password.';err.classList.add('show');return}try{await apiAdminLogin(e,p);err.classList.remove('show');location.href='admin-panel.html'}catch(ex){err.textContent=ex.message;err.classList.add('show')}}
</script></body></html>
