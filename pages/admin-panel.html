<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Panel – AgroTECH</title><link rel="stylesheet" href="../css/global.css"><style>
body{background:#f5f7f6}.admin-layout{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:#0b2e12;color:white;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{font-size:22px;font-weight:800;padding:8px 12px 25px}.brand span{color:#69f0ae}.side-btn{display:block;width:100%;text-align:left;background:transparent;border:0;color:#d9eadc;padding:12px 14px;border-radius:10px;margin:4px 0;cursor:pointer;font-size:14px}.side-btn:hover,.side-btn.active{background:#1b5e20;color:white}.logout{margin-top:18px;background:#8b1e1e}.main{padding:25px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0}.admin-user{background:white;padding:10px 14px;border-radius:12px;border:1px solid #e3e8e4}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:white;border:1px solid #e2e8e3;border-radius:16px;padding:18px}.stat small{color:#718096}.stat strong{display:block;font-size:27px;margin-top:8px;color:#145a1c}.content{margin-top:20px}.panel{background:white;border:1px solid #e2e8e3;border-radius:16px;padding:20px;margin-bottom:18px}.panel h2{margin-top:0}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid #edf0ee;font-size:14px}.pill{padding:5px 9px;border-radius:999px;background:#e8f5e9;color:#1b5e20;font-size:12px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}.mini{border:0;padding:7px 10px;border-radius:8px;cursor:pointer}.approve{background:#e8f5e9;color:#1b5e20}.reject{background:#ffebee;color:#b71c1c}.search{width:100%;padding:11px;border:1px solid #dfe6e1;border-radius:9px;margin-bottom:12px}.feature-list{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.feature{padding:14px;border:1px solid #e4e9e5;border-radius:12px}.feature b{display:block;margin-bottom:4px}.feature span{font-size:13px;color:#667085}@media(max-width:950px){.admin-layout{grid-template-columns:1fr}.sidebar{height:auto;position:relative}.grid{grid-template-columns:repeat(2,1fr)}.feature-list{grid-template-columns:1fr 1fr}}@media(max-width:600px){.main{padding:18px}.grid{grid-template-columns:1fr}.feature-list{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div class="admin-layout"><aside class="sidebar"><div class="brand">🌱 Agro<span>TECH</span></div><button class="side-btn active" onclick="showSection('dashboard',this)">📊 Dashboard</button><button class="side-btn" onclick="showSection('users',this)">👥 Users / Farmers</button><button class="side-btn" onclick="showSection('listings',this)">🚜 Listings & Services</button><button class="side-btn" onclick="showSection('orders',this)">📦 Orders / Bookings</button><button class="side-btn" onclick="showSection('payments',this)">💳 Payments</button><button class="side-btn" onclick="showSection('complaints',this)">⚠️ Complaints</button><button class="side-btn" onclick="showSection('reports',this)">📈 Reports & Analytics</button><button class="side-btn" onclick="showSection('notifications',this)">🔔 Notifications</button><button class="side-btn" onclick="showSection('settings',this)">⚙️ Settings</button><button class="side-btn logout" onclick="adminLogout()">🚪 Logout</button></aside><main class="main"><div class="top"><div><h1 id="title">Admin Dashboard</h1><p style="color:#718096;margin:5px 0">Manage the complete AgroTech platform.</p></div><div class="admin-user">🛡️ <span id="adminName">Administrator</span></div></div><div id="content"></div></main></div><script src="../js/api.js"></script><script src="../js/global.js"></script><script>
let cache={};
async function adminApi(path,options={}){return apiRequest(path,options)}
async function showSection(sec,btn){document.querySelectorAll('.side-btn').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');const titles={dashboard:'Admin Dashboard',users:'Users & Farmers',listings:'Listings & Services',orders:'Orders & Bookings',payments:'Payments',complaints:'Complaints & Support',reports:'Reports & Analytics',notifications:'Notifications',settings:'Admin Settings'};document.getElementById('title').textContent=titles[sec];const c=document.getElementById('content');c.innerHTML='<div class="panel">Loading...</div>';try{if(sec==='dashboard')c.innerHTML=await dashboard();if(sec==='users')c.innerHTML=await usersView();if(sec==='listings')c.innerHTML=await listingsView();if(sec==='orders')c.innerHTML=await ordersView();if(sec==='payments')c.innerHTML=await paymentsView();if(sec==='complaints')c.innerHTML=await complaintsView();if(sec==='reports')c.innerHTML=await reportsView();if(sec==='notifications')c.innerHTML=notificationsView();if(sec==='settings')c.innerHTML=settingsView()}catch(e){c.innerHTML=`<div class="panel"><h2>Backend error</h2><p>${e.message}</p><p>Check backend/.env and run FastAPI.</p></div>`}}
async function dashboard(){const d=await adminApi('/admin/dashboard');return `<div class="grid"><div class="stat"><small>Total Users</small><strong>${d.users}</strong></div><div class="stat"><small>Products</small><strong>${d.products}</strong></div><div class="stat"><small>Services</small><strong>${d.services}</strong></div><div class="stat"><small>Orders</small><strong>${d.orders}</strong></div></div><div class="content"><div class="panel"><h2>Platform Overview</h2><div class="feature-list"><div class="feature"><b>💰 Revenue</b><span>₹${Number(d.revenue||0).toLocaleString('en-IN')}</span></div><div class="feature"><b>⏳ Pending Orders</b><span>${d.pending_orders}</span></div><div class="feature"><b>🔐 Authentication</b><span>JWT + FastAPI</span></div><div class="feature"><b>🗄️ Database</b><span>Supabase PostgreSQL</span></div></div></div></div>`}
async function usersView(){const r=await adminApi('/admin/users');cache.users=r.users;return `<div class="panel"><input class="search" placeholder="Search users by name, phone or role..." oninput="filterTable(this,'usersTable')"><div class="table-wrap"><table class="table" id="usersTable"><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Status</th><th>Actions</th></tr>${r.users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.role}</td><td>${u.phone}</td><td><span class="pill">${u.status}</span></td><td class="actions"><button class="mini approve" onclick="changeUserStatus('${u.id}','active')">Activate</button><button class="mini reject" onclick="changeUserStatus('${u.id}','blocked')">Block</button></td></tr>`).join('')}</table></div></div>`}
async function listingsView(){const r=await adminApi('/admin/listings');cache.listings=r.listings;return `<div class="panel"><h2>Listing & Service Approval</h2><div class="table-wrap"><table class="table"><tr><th>Item</th><th>Owner</th><th>Type</th><th>Status</th><th>Actions</th></tr>${r.listings.map(x=>`<tr><td>${x.name}</td><td>${x.users?.name||'—'}</td><td>${x.category}</td><td><span class="pill">${x.status}</span></td><td class="actions"><button class="mini approve" onclick="changeListingStatus(${x.id},'approved')">Approve</button><button class="mini reject" onclick="changeListingStatus(${x.id},'rejected')">Reject</button></td></tr>`).join('')}</table></div></div>`}
async function ordersView(){const r=await adminApi('/admin/orders');cache.orders=r.orders;return `<div class="panel"><h2>Bookings & Orders</h2><div class="table-wrap"><table class="table"><tr><th>ID</th><th>Customer</th><th>Item</th><th>Amount</th><th>Status</th><th>Action</th></tr>${r.orders.map(x=>`<tr><td>${x.order_id}</td><td>${x.users?.name||'—'}</td><td>${x.product_name}</td><td>₹${Number(x.price).toLocaleString('en-IN')}</td><td><span class="pill">${x.status}</span></td><td><select onchange="changeOrderStatus('${x.order_id}',this.value)"><option value="pending" ${x.status==='pending'?'selected':''}>Pending</option><option value="confirmed" ${x.status==='confirmed'?'selected':''}>Confirmed</option><option value="completed" ${x.status==='completed'?'selected':''}>Completed</option><option value="cancelled" ${x.status==='cancelled'?'selected':''}>Cancelled</option></select></td></tr>`).join('')}</table></div></div>`}
async function paymentsView(){const r=await adminApi('/admin/payments');const paid=r.payments.filter(x=>['paid','success','completed'].includes(x.payment_status)||x.status==='completed');const revenue=paid.reduce((s,x)=>s+Number(x.price||0),0);return `<div class="grid"><div class="stat"><small>Total Collected</small><strong>₹${revenue.toLocaleString('en-IN')}</strong></div><div class="stat"><small>Pending</small><strong>${r.payments.filter(x=>x.payment_status==='pending').length}</strong></div><div class="stat"><small>Transactions</small><strong>${r.payments.length}</strong></div><div class="stat"><small>Methods</small><strong>${new Set(r.payments.map(x=>x.payment_method)).size}</strong></div></div><div class="panel" style="margin-top:20px"><h2>Recent Payments</h2><div class="table-wrap"><table class="table"><tr><th>Order</th><th>Amount</th><th>Method</th><th>Payment Status</th><th>Order Status</th></tr>${r.payments.slice(0,20).map(x=>`<tr><td>${x.order_id}</td><td>₹${Number(x.price).toLocaleString('en-IN')}</td><td>${x.payment_method}</td><td>${x.payment_status}</td><td>${x.status}</td></tr>`).join('')}</table></div></div>`}
async function complaintsView(){const r=await adminApi('/admin/complaints');return `<div class="panel"><h2>Complaints</h2><div class="table-wrap"><table class="table"><tr><th>Ticket</th><th>Customer</th><th>Issue</th><th>Priority</th><th>Status</th><th>Action</th></tr>${r.complaints.map(x=>`<tr><td>#C-${x.id}</td><td>${x.users?.name||'—'}</td><td>${x.subject}</td><td>${x.priority}</td><td>${x.status}</td><td><button class="mini approve" onclick="resolveComplaint(${x.id})">Resolve</button></td></tr>`).join('')}</table></div></div>`}
async function reportsView(){const d=await adminApi('/admin/dashboard');return `<div class="grid"><div class="stat"><small>Users</small><strong>${d.users}</strong></div><div class="stat"><small>Products</small><strong>${d.products}</strong></div><div class="stat"><small>Services</small><strong>${d.services}</strong></div><div class="stat"><small>Revenue</small><strong>₹${Number(d.revenue||0).toLocaleString('en-IN')}</strong></div></div><div class="panel" style="margin-top:20px"><h2>Analytics</h2><p>Live platform statistics are read from Supabase through FastAPI.</p></div>`}
function notificationsView(){return `<div class="panel"><h2>Send Platform Notification</h2><div class="form-group"><label class="form-label">Audience</label><select id="audience" class="form-select"><option value="all">All Users</option><option value="farmer">Farmers</option><option value="seller">Sellers</option><option value="admin">Admins</option></select></div><div class="form-group"><label class="form-label">Message</label><textarea id="message" class="form-input" rows="5" placeholder="Write announcement..."></textarea></div><button class="btn btn-primary" onclick="sendNotification()">📣 Send Notification</button></div>`}
function settingsView(){return `<div class="panel"><h2>Admin Settings</h2><div class="feature-list"><div class="feature"><b>🔐 Security</b><span>JWT authentication and role-based access.</span></div><div class="feature"><b>🗄️ Database</b><span>Supabase PostgreSQL via server-side service role.</span></div><div class="feature"><b>⚡ API</b><span>FastAPI REST API with automatic Swagger docs.</span></div><div class="feature"><b>📝 Audit-ready structure</b><span>Orders, complaints and notifications are stored server-side.</span></div></div></div>`}
async function changeUserStatus(id,status){try{await adminApi('/admin/users/'+id+'/status',{method:'PUT',body:JSON.stringify({status})});showToast('User status updated','success');showSection('users',document.querySelectorAll('.side-btn')[1])}catch(e){showToast(e.message,'error')}}
async function changeListingStatus(id,status){try{await adminApi('/admin/listings/'+id+'/status',{method:'PUT',body:JSON.stringify({status})});showToast('Listing status updated','success');showSection('listings',document.querySelectorAll('.side-btn')[2])}catch(e){showToast(e.message,'error')}}
async function changeOrderStatus(id,status){try{await adminApi('/admin/orders/'+encodeURIComponent(id)+'/status',{method:'PUT',body:JSON.stringify({status})});showToast('Order status updated','success');showSection('orders',document.querySelectorAll('.side-btn')[3])}catch(e){showToast(e.message,'error')}}
async function resolveComplaint(id){try{await adminApi('/admin/complaints/'+id+'/status',{method:'PUT',body:JSON.stringify({status:'resolved'})});showToast('Complaint resolved','success');showSection('complaints',document.querySelectorAll('.side-btn')[5])}catch(e){showToast(e.message,'error')}}
function filterTable(input,id){const q=input.value.toLowerCase();document.querySelectorAll('#'+id+' tr').forEach((r,i)=>{r.style.display=i===0||r.innerText.toLowerCase().includes(q)?'':'none'})}
async function sendNotification(){const m=document.getElementById('message').value.trim();if(!m)return alert('Write a message first');try{await adminApi('/admin/notifications',{method:'POST',body:JSON.stringify({audience:document.getElementById('audience').value,message:m})});showToast('Notification sent successfully','success');document.getElementById('message').value=''}catch(e){showToast(e.message,'error')}}
function adminLogout(){clearSession();localStorage.removeItem('agro_admin_user');location.href='../index.html'}
(async()=>{if(!localStorage.getItem('agro_token')){location.href='admin-login.html';return}try{const m=await apiRequest('/auth/me');if(m.user.role!=='admin')throw new Error('Admin access required');document.getElementById('adminName').textContent=m.user.name;await showSection('dashboard',document.querySelector('.side-btn.active'))}catch(e){clearSession();location.href='admin-login.html'}})();
</script></body></html>
