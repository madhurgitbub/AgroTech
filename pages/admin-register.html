<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Register – AgroTECH</title><link rel="stylesheet" href="../css/global.css"><style>body{min-height:100vh;background:linear-gradient(135deg,#062b0a,#145a1c,#2e7d32);display:grid;place-items:center;padding:20px}.auth{width:min(500px,100%)}.brand{text-align:center;color:white;margin-bottom:18px}.brand span{color:#69f0ae}.card{background:white;border-radius:22px;padding:30px;box-shadow:0 24px 70px #0006}.note{background:#fff8e1;padding:12px;border-radius:10px;color:#7a5a00;font-size:13px;margin-bottom:16px}.links{text-align:center;margin-top:15px;font-size:14px}.links a{color:#2e7d32;font-weight:700;text-decoration:none}</style></head><body><div class="auth"><div class="brand"><div style="font-size:40px">🛡️</div><h1>Agro<span>TECH</span> Admin</h1><p>Create an administrator account</p></div><div class="card"><h2>Admin Registration</h2><div class="note">Admin accounts are stored securely in Supabase through the FastAPI backend. For production, protect admin registration with super-admin approval.</div><div class="form-group"><label class="form-label">Full Name *</label><input id="name" class="form-input" placeholder="Admin Name"></div><div class="form-group"><label class="form-label">Admin Username *</label><input id="username" class="form-input" placeholder="admin01"></div><div class="form-group"><label class="form-label">Email *</label><input id="email" type="email" class="form-input" placeholder="admin@agrotech.com"></div><div class="form-group"><label class="form-label">Password *</label><input id="password" type="password" class="form-input" placeholder="Minimum 8 characters"></div><div class="form-group"><label class="form-label">Confirm Password *</label><input id="confirm" type="password" class="form-input" placeholder="Re-enter password"></div><button class="btn btn-primary btn-full btn-lg" onclick="registerAdmin()">Create Admin Account →</button><div class="links"><a href="admin-login.html">Already an admin? Login</a> · <a href="../index.html">Home</a></div></div></div><script src="../js/api.js"></script><script src="../js/global.js"></script><script>
async function registerAdmin(){const n=document.getElementById('name').value.trim(),u=document.getElementById('username').value.trim(),e=document.getElementById('email').value.trim(),p=document.getElementById('password').value,c=document.getElementById('confirm').value;if(!n||!u||!e||!p||!c)return showToast('Fill all required fields.','error');if(p.length<8)return showToast('Password must be at least 8 characters.','error');if(p!==c)return showToast('Passwords do not match.','error');try{await apiAdminRegister({name:n,email:e,phone:'0000000000',password:p,location:'',role:'admin'});showToast('Admin account created successfully.','success');setTimeout(()=>location.href='admin-login.html',900)}catch(ex){showToast(ex.message,'error')}}
</script></body></html>
