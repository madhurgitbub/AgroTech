<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Services – AgroTECH</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/home.css">
  <style>
    .services-layout {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1.5rem 3rem;
    }

    .services-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
      flex-wrap: wrap;
      gap: 12px;
    }

    .services-header h2 { font-size: 1.25rem; color: var(--green-900); }

    /* Service card (list view) */
    .service-list-card {
      background: white;
      border-radius: var(--radius-lg);
      border: 1px solid var(--green-100);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: stretch;
      overflow: hidden;
      transition: var(--transition);
      margin-bottom: 1rem;
    }

    .service-list-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateX(3px);
      border-color: var(--green-300);
    }

    .service-list-img {
      width: 140px;
      min-height: 130px;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--green-50);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--green-300);
    }

    .service-list-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .service-list-body {
      padding: 1rem 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .service-list-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

    .service-list-name {
      font-family: 'Sora', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--gray-800);
      margin-bottom: 3px;
    }

    .service-list-desc {
      font-size: 0.82rem;
      color: var(--gray-500);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .service-list-price {
      font-family: 'Sora', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--green-700);
      white-space: nowrap;
    }

    .service-list-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .service-list-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .service-actions {
      display: flex;
      gap: 8px;
    }

    /* Toggle Active Switch */
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      inset: 0;
      background: var(--gray-300);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition);
    }

    .toggle-slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      left: 3px;
      top: 3px;
      transition: var(--transition);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }

    .toggle-switch input:checked + .toggle-slider { background: var(--green-500); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }

    /* Edit Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      z-index: 9000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }

    .edit-modal {
      background: white;
      border-radius: var(--radius-xl);
      padding: 2rem;
      width: 100%;
      max-width: 520px;
      box-shadow: var(--shadow-xl);
      max-height: 90vh;
      overflow-y: auto;
      animation: fadeInUp 0.35s ease;
    }

    .edit-modal h3 {
      font-size: 1.15rem;
      color: var(--green-900);
      margin-bottom: 1.25rem;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--green-100);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-close {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--gray-100);
      border: none;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .modal-close:hover { background: #ffebee; color: #c62828; }

    /* Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media(max-width:600px) { .stats-bar { grid-template-columns: repeat(2, 1fr); } }

    .stat-mini {
      background: white;
      border-radius: var(--radius-lg);
      padding: 1rem;
      text-align: center;
      border: 1px solid var(--green-100);
      box-shadow: var(--shadow-sm);
    }

    .stat-mini-num {
      font-family: 'Sora', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--green-700);
      line-height: 1;
      margin-bottom: 3px;
    }

    .stat-mini-label { font-size: 0.75rem; color: var(--gray-400); }

    /* Delete confirm */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      z-index: 9100;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .confirm-overlay.show { display: flex; }

    .confirm-box {
      background: white;
      border-radius: var(--radius-xl);
      padding: 2rem;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: var(--shadow-xl);
      animation: fadeInUp 0.3s ease;
    }

    .confirm-box h3 { color: var(--gray-900); margin-bottom: 0.5rem; }
    .confirm-box p { font-size: 0.875rem; color: var(--gray-500); margin-bottom: 1.5rem; }
    .confirm-btns { display: flex; gap: 10px; justify-content: center; }
  </style>
</head>
<body>

  <nav class="navbar" id="navbar"></nav>

  <div class="page-header">
    <h1>📝 My Services</h1>
    <p>Manage your listed products and services</p>
  </div>

  <div class="services-layout">

    <!-- Stats bar -->
    <div class="stats-bar">
      <div class="stat-mini">
        <div class="stat-mini-num" id="statTotal">0</div>
        <div class="stat-mini-label">Total Listings</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-num" id="statActive">0</div>
        <div class="stat-mini-label">Active</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-num" id="statInactive">0</div>
        <div class="stat-mini-label">Inactive</div>
      </div>
      <div class="stat-mini">
        <div class="stat-mini-num" id="statEarnings">₹0</div>
        <div class="stat-mini-label">Est. Earnings</div>
      </div>
    </div>

    <div class="services-header">
      <h2>Your Listings</h2>
      <a href="addService.html" class="btn btn-primary">➕ Add New Service</a>
    </div>

    <!-- Filter tabs -->
    <div class="filter-tabs" id="filterTabs" style="margin-bottom:1.25rem">
      <button class="filter-tab active" onclick="filterServices('all', this)">All</button>
      <button class="filter-tab" onclick="filterServices('active', this)">✅ Active</button>
      <button class="filter-tab" onclick="filterServices('inactive', this)">⏸ Inactive</button>
      <button class="filter-tab" onclick="filterServices('machinery', this)">🚜 Machinery</button>
      <button class="filter-tab" onclick="filterServices('fertilizer', this)">🌿 Fertilizer</button>
    </div>

    <div id="serviceList"></div>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="edit-modal">
      <h3>
        ✏️ Edit Service
        <button class="modal-close" onclick="closeEdit()">✕</button>
      </h3>
      <input type="hidden" id="editId">

      <div class="form-group">
        <label class="form-label">Service Name *</label>
        <input type="text" id="editName" class="form-input" placeholder="e.g. Tractor Rental">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group">
          <label class="form-label">Category *</label>
          <select id="editCat" class="form-select">
            <option value="machinery">🚜 Machinery</option>
            <option value="fertilizer">🌿 Fertilizer</option>
            <option value="irrigation">💧 Irrigation</option>
            <option value="transport">🚛 Transport</option>
            <option value="seeds">🌱 Seeds</option>
            <option value="other">📦 Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Price (₹) *</label>
          <input type="number" id="editPrice" class="form-input" placeholder="0">
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="form-group">
          <label class="form-label">Price Unit</label>
          <select id="editUnit" class="form-select">
            <option value="per day">Per Day</option>
            <option value="per acre">Per Acre</option>
            <option value="per kg">Per KG</option>
            <option value="per bag">Per Bag</option>
            <option value="per trip">Per Trip</option>
            <option value="per kit">Per Kit</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Location</label>
          <input type="text" id="editLocation" class="form-input" placeholder="Town, District">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Description *</label>
        <textarea id="editDesc" class="form-textarea" rows="3" placeholder="Describe your service..."></textarea>
      </div>

      <div style="display:flex;gap:10px;margin-top:4px">
        <button class="btn btn-primary" style="flex:1" onclick="saveEdit()">💾 Save Changes</button>
        <button class="btn btn-secondary" onclick="closeEdit()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <div style="font-size:2.5rem;margin-bottom:0.75rem">🗑️</div>
      <h3>Delete this listing?</h3>
      <p>This action cannot be undone. The service will be permanently removed.</p>
      <div class="confirm-btns">
        <button class="btn btn-danger" onclick="confirmDelete()">Yes, Delete</button>
        <button class="btn btn-secondary" onclick="closeConfirm()">Cancel</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>© 2025 AgroTECH • <a href="help.html">Help</a></p>
  </footer>

  <div id="global-toast" class="toast"></div>
  <script src="../js/api.js"></script><script src="../js/global.js"></script>
  <script>
    let services = [];
    let deleteTargetId = null;
    let currentFilter = 'all';

    document.addEventListener('DOMContentLoaded', () => {
      requireAuth();
      renderNavbar('');
      loadServices();
    });

    async function loadServices() {
      try { const data=await apiRequest('/services'); services=data.services||[]; updateStats(); renderServices(services); }
      catch(e){ showToast(e.message,'error'); }
    }

    function updateStats() {
      const active = services.filter(s => s.available !== false).length;
      document.getElementById('statTotal').textContent = services.length;
      document.getElementById('statActive').textContent = active;
      document.getElementById('statInactive').textContent = services.length - active;
      const earnings = services.filter(s => s.available !== false).reduce((sum, s) => sum + (s.price || 0), 0);
      document.getElementById('statEarnings').textContent = formatPrice(earnings);
    }

    function filterServices(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      let filtered = services;
      if (type === 'active') filtered = services.filter(s => s.available !== false);
      else if (type === 'inactive') filtered = services.filter(s => s.available === false);
      else if (['machinery','fertilizer','irrigation','transport','seeds'].includes(type)) {
        filtered = services.filter(s => s.category === type);
      }
      renderServices(filtered);
    }

    function renderServices(list) {
      const el = document.getElementById('serviceList');
      if (list.length === 0) {
        el.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📋</div>
            <h3>No listings found</h3>
            <p>You haven't listed any services yet. Start earning by sharing your resources!</p>
            <a href="addService.html" class="btn btn-primary" style="margin-top:1rem">➕ Add First Service</a>
          </div>`;
        return;
      }

      el.innerHTML = list.map(s => {
        const isActive = s.available !== false;
        const imgSrc = s.image && s.image.length > 100 ? s.image : null; // base64 check
        return `
          <div class="service-list-card animate-fade-up" id="scard-${s.id}">
            <div class="service-list-img">
              ${imgSrc
                ? `<img src="${imgSrc}" alt="${s.name}" onerror="this.parentElement.innerHTML='${getCategoryIcon(s.category)}'"`
                : getCategoryIcon(s.category)
              }
            </div>
            <div class="service-list-body">
              <div class="service-list-top">
                <div>
                  <div class="service-list-name">${s.name}</div>
                  <div class="service-list-desc">${s.description}</div>
                </div>
                <div style="text-align:right;flex-shrink:0">
                  <div class="service-list-price">${formatPrice(s.price)}</div>
                  <div style="font-size:0.75rem;color:var(--gray-400)">${s.unit}</div>
                </div>
              </div>
              <div class="service-list-meta">
                <div class="service-list-tags">
                  <span class="badge badge-info">${getCategoryIcon(s.category)} ${s.category}</span>
                  <span class="badge ${isActive ? 'badge-success' : 'badge-warning'}">${isActive ? '✅ Active' : '⏸ Inactive'}</span>
                  <span style="font-size:0.75rem;color:var(--gray-400)">📍 ${s.location || '—'}</span>
                </div>
                <div class="service-actions">
                  <label class="toggle-switch" title="${isActive ? 'Deactivate' : 'Activate'}">
                    <input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleAvailability(${s.id}, this.checked)">
                    <span class="toggle-slider"></span>
                  </label>
                  <button class="btn btn-secondary btn-sm" onclick="openEdit(${s.id})">✏️</button>
                  <button class="btn btn-danger btn-sm" onclick="openConfirm(${s.id})">🗑️</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleAvailability(id, checked) {
      const idx=services.findIndex(s=>Number(s.id)===Number(id)); if(idx<0)return; const s=services[idx];
      try { const updated=await apiRequest('/services/'+id,{method:'PUT',body:JSON.stringify({name:s.name,category:s.category,price:s.price,unit:s.unit,description:s.description,location:s.location||'',image:s.image||'',available:checked})}); services[idx]=updated; updateStats(); renderServices(services); showToast(checked?'Listing activated ✅':'Listing deactivated ⏸',checked?'success':'info'); } catch(e){showToast(e.message,'error');}
    }
    function openEdit(id) {
      const s = services.find(x => x.id === id);
      if (!s) return;
      document.getElementById('editId').value = s.id;
      document.getElementById('editName').value = s.name;
      document.getElementById('editCat').value = s.category;
      document.getElementById('editPrice').value = s.price;
      document.getElementById('editUnit').value = s.unit;
      document.getElementById('editLocation').value = s.location || '';
      document.getElementById('editDesc').value = s.description;
      document.getElementById('editModal').classList.add('show');
    }

    function closeEdit() {
      document.getElementById('editModal').classList.remove('show');
    }

    async function saveEdit(){
      const id=Number(document.getElementById('editId').value); const service=services.find(x=>Number(x.id)===id); if(!service)return;
      const payload={name:document.getElementById('editName').value.trim(),category:document.getElementById('editCat').value,price:Number(document.getElementById('editPrice').value),unit:document.getElementById('editUnit').value,location:document.getElementById('editLocation').value.trim(),description:document.getElementById('editDesc').value.trim(),image:service.image||'',available:service.available!==false};
      try { const updated=await apiRequest('/services/'+id,{method:'PUT',body:JSON.stringify(payload)}); services=services.map(x=>Number(x.id)===id?updated:x); closeEdit(); updateStats(); renderServices(services); showToast('Service updated successfully.','success'); } catch(e){showToast(e.message,'error');}
    }

    function openConfirm(id) {
      deleteTargetId = id;
      document.getElementById('confirmOverlay').classList.add('show');
    }

    function closeConfirm() {
      deleteTargetId = null;
      document.getElementById('confirmOverlay').classList.remove('show');
    }

    async function confirmDelete(){
      if(deleteTargetId===null)return; try{await apiRequest('/services/'+deleteTargetId,{method:'DELETE'}); services=services.filter(x=>Number(x.id)!==Number(deleteTargetId)); closeConfirm(); updateStats(); renderServices(services); showToast('Service deleted.','success');}catch(e){showToast(e.message,'error');}
    }

    function saveAllServices() {
      
    }
  </script>
</body>
</html>
