<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – AgroTECH</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a2e0d 0%, #1b5e20 50%, #2e7d32 100%);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 480px;
      padding-bottom: 2rem;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .auth-brand h1 { font-size: 1.5rem; color: white; }
    .auth-brand h1 span { color: #69f0ae; }
    .auth-brand p { color: rgba(255,255,255,0.6); font-size: 0.85rem; margin-top: 4px; }

    .auth-card {
      background: rgba(255,255,255,0.97);
      border-radius: var(--radius-xl);
      padding: 2.25rem;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
    }

    .auth-card h2 { font-size: 1.3rem; color: var(--green-900); margin-bottom: 0.3rem; }
    .auth-card .subtitle { color: var(--gray-500); font-size: 0.875rem; margin-bottom: 1.5rem; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media(max-width:480px) { .form-row { grid-template-columns: 1fr; } }

    .auth-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: var(--gray-500);
    }
    .auth-footer a { color: var(--green-600); font-weight: 600; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }

    .step-indicator {
      display: flex;
      gap: 6px;
      margin-bottom: 1.5rem;
    }
    .step-dot {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--gray-200);
      transition: var(--transition);
    }
    .step-dot.active { background: var(--green-500); }
    .step-dot.done { background: var(--green-700); }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-brand">
      <h1>🌱 Agro<span>TECH</span></h1>
      <p>Join thousands of farmers growing smarter</p>
    </div>

    <div class="auth-card">
      <h2>Create Account 🌾</h2>
      <p class="subtitle">Fill in your details to get started</p>

      <div class="step-indicator">
        <div class="step-dot active" id="dot1"></div>
        <div class="step-dot" id="dot2"></div>
        <div class="step-dot" id="dot3"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" id="name" class="form-input" placeholder="Ramesh Kumar" required>
        </div>
        <div class="form-group">
          <label class="form-label">Contact Number *</label>
          <input type="tel" id="contact" class="form-input" placeholder="9876543210" maxlength="10" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Password *</label>
          <input type="password" id="password" class="form-input" placeholder="Min 6 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password *</label>
          <input type="password" id="confirmPw" class="form-input" placeholder="Re-enter password" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Address</label>
        <input type="text" id="address" class="form-input" placeholder="Village / Town, District">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">State</label>
          <select id="state" class="form-select">
            <option value="">Select state</option>
            <option>Madhya Pradesh</option>
            <option>Uttar Pradesh</option>
            <option>Maharashtra</option>
            <option>Rajasthan</option>
            <option>Punjab</option>
            <option>Haryana</option>
            <option>Gujarat</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Pincode</label>
          <input type="text" id="pincode" class="form-input" placeholder="452001" maxlength="6">
        </div>
      </div>

      <button class="btn btn-primary btn-full btn-lg" onclick="handleRegister()" style="margin-top:4px">
        Create Account →
      </button>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

  <div id="global-toast" class="toast"></div>
  <script src="../js/api.js"></script><script src="../js/global.js"></script>
  <script>
    if (AgroData.isLoggedIn()) window.location.href = 'home.html';

    const inputs = ['name','contact','email','password'];
    inputs.forEach(id => {
      document.getElementById(id).addEventListener('input', updateStepDots);
    });

    function updateStepDots() {
      const name = document.getElementById('name').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const email = document.getElementById('email').value.trim();
      const pw = document.getElementById('password').value;

      document.getElementById('dot1').className = 'step-dot ' + (name && contact ? 'done' : 'active');
      document.getElementById('dot2').className = 'step-dot ' + (email ? (name && contact ? 'done' : 'active') : (name && contact ? 'active' : ''));
      document.getElementById('dot3').className = 'step-dot ' + (pw ? 'active' : '');
    }

    async function handleRegister() {
      const name = document.getElementById('name').value.trim();
      const contact = document.getElementById('contact').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPw = document.getElementById('confirmPw').value;
      const state = document.getElementById('state').value;
      const address = document.getElementById('address').value.trim();
      if (!name || !contact || !email || !password) return showToast('Please fill in all required fields.', 'error');
      if (!/^\d{10}$/.test(contact)) return showToast('Contact must be a valid 10-digit number.', 'error');
      if (!/\S+@\S+\.\S+/.test(email)) return showToast('Please enter a valid email address.', 'error');
      if (password.length < 6) return showToast('Password must be at least 6 characters.', 'error');
      if (password !== confirmPw) return showToast('Passwords do not match!', 'error');
      try {
        await apiRegister({ name, email, phone: contact, password, location: (address || '') + (state ? ', ' + state : ''), role: 'farmer' });
        showToast('Account created successfully! Welcome 🌱', 'success');
        setTimeout(() => { window.location.href = 'home.html'; }, 900);
      } catch (e) { showToast(e.message, 'error'); }
    }
  </script>
</body>
</html>
