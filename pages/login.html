<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – AgroTECH</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a2e0d 0%, #1b5e20 50%, #2e7d32 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeInUp 0.5s ease;
    }

    .auth-brand .logo-big {
      width: 64px;
      height: 64px;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1rem;
    }

    .auth-brand h1 {
      font-size: 1.8rem;
      color: white;
    }

    .auth-brand h1 span { color: #69f0ae; }

    .auth-brand p {
      color: rgba(255,255,255,0.6);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .auth-card {
      background: rgba(255,255,255,0.97);
      border-radius: var(--radius-xl);
      padding: 2.5rem;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      animation: fadeInUp 0.6s ease;
    }

    .auth-card h2 {
      font-size: 1.4rem;
      color: var(--green-900);
      margin-bottom: 0.4rem;
    }

    .auth-card .subtitle {
      color: var(--gray-500);
      font-size: 0.875rem;
      margin-bottom: 1.75rem;
    }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
    }

    .input-with-icon .form-input {
      padding-left: 40px;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      font-size: 1rem;
      color: var(--gray-400);
      transition: var(--transition);
      background: none;
      border: none;
      padding: 0;
    }

    .password-toggle:hover { color: var(--green-600); }

    .auth-footer {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.875rem;
      color: var(--gray-500);
    }

    .auth-footer a {
      color: var(--green-600);
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer a:hover { text-decoration: underline; }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--gray-300);
      font-size: 0.8rem;
      margin: 1.25rem 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gray-200);
    }

    .error-msg {
      background: #ffebee;
      color: #c62828;
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .error-msg.show { display: flex; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-brand">
      <div class="logo-big">🌱</div>
      <h1>Agro<span>TECH</span></h1>
      <p>Your smart farming companion</p>
    </div>

    <div class="auth-card">
      <h2>Welcome back 👋</h2>
      <p class="subtitle">Login to continue your farming journey</p>

      <div class="error-msg" id="loginError">
        <span>⚠️</span>
        <span id="errorText">Invalid username or password.</span>
      </div>

      <div class="form-group">
        <label class="form-label">Username / Phone</label>
        <div class="input-with-icon">
          <span class="icon">👤</span>
          <input type="text" id="username" class="form-input" placeholder="Enter your username" autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-with-icon">
          <span class="icon">🔒</span>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password">
          <button class="password-toggle" onclick="togglePassword()" id="pwToggle">👁️</button>
        </div>
      </div>

      <button class="btn btn-primary btn-full btn-lg" onclick="handleLogin()" style="margin-top:4px">
        Login →
      </button>

      <div class="divider">or</div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html">Register now</a>
      </div>
      <div class="auth-footer" style="margin-top:8px">
        <a href="../index.html">← Back to Home</a>
      </div>
    </div>
  </div>

  <div id="global-toast" class="toast"></div>
  <script src="../js/api.js"></script><script src="../js/global.js"></script>
  <script>
    // Redirect if already logged in
    if (AgroData.isLoggedIn()) window.location.href = 'home.html';

    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const err = document.getElementById('loginError');
      if (!username || !password) { document.getElementById('errorText').textContent = 'Please fill in all fields.'; err.classList.add('show'); return; }
      if (password.length < 6) { document.getElementById('errorText').textContent = 'Password must be at least 6 characters.'; err.classList.add('show'); return; }
      try {
        await apiLogin(username, password);
        err.classList.remove('show');
        showToast('Login successful! Welcome back 🌱', 'success');
        setTimeout(() => { window.location.href = 'home.html'; }, 700);
      } catch (e) { document.getElementById('errorText').textContent = e.message; err.classList.add('show'); }
    }

    function togglePassword() {
      const pw = document.getElementById('password');
      const btn = document.getElementById('pwToggle');
      if (pw.type === 'password') { pw.type = 'text'; btn.textContent = '🙈'; }
      else { pw.type = 'password'; btn.textContent = '👁️'; }
    }

    // Enter key support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
